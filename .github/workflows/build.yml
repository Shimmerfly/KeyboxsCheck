name: Android CI (manual)

# The thorough pass: unit tests, both variants and lint. It no longer runs on
# its own - a push only needs to know that the APK still builds, which is what
# build-push.yml answers in a fraction of the time. Ask for this one when the
# slower checks are actually wanted.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run unit tests
      run: ./gradlew --no-daemon :app:testDebugUnitTest

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-report
        path: |
          app/build/reports/tests/testDebugUnitTest
          app/build/test-results/testDebugUnitTest

  build:
    name: Debug and release build, lint
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Assemble debug APK
      run: ./gradlew --no-daemon :app:assembleDebug

    # The release variant is built here so a shrinker regression is caught
    # before a tag. Without KEYSTORE_* the apksign plugin falls back to the
    # debug signature, which keeps this step green.
    - name: Assemble release APK
      run: ./gradlew --no-daemon :app:assembleRelease

    - name: Lint
      run: ./gradlew --no-daemon :app:lintDebug

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-unsigned-debugkey
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error

    - name: Upload lint report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-report
        path: app/build/reports/lint-results-debug.html
